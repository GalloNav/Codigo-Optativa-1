# SQL Server local para VetSync: una instancia, tres bases (una por servicio).
# Uso: copia .env.example a .env y ejecuta "docker compose up -d".
name: vetsync

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vetsync-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env y define DB_PASSWORD}
    ports:
      # Solo la propia máquina: el usuario sa no debe ser alcanzable desde la red.
      - "127.0.0.1:${DB_PORT:-1433}:1433"
    volumes:
      - vetsync-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Tarea de una sola ejecución: crea las bases si no existen (idempotente).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - ./infra:/init:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-C", "-b", "-S", "sqlserver", "-U", "sa", "-P", "${DB_PASSWORD}", "-i", "/init/init-databases.sql"]
    restart: "no"

volumes:
  vetsync-sqlserver-data:
