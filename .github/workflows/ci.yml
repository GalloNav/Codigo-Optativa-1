name: CI de VetSync

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verificar los tres microservicios
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar Checkstyle y todas las pruebas
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Guardar los informes de pruebas
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-pruebas
          path: |
            */target/surefire-reports/TEST-*.xml
            */target/failsafe-reports/TEST-*.xml
